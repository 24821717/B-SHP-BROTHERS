# B-SHP BROTHERS — Nginx
# Sitio estático. La raíz es el CONTENIDO de la carpeta web/ del repo.

server {
    listen 443 ssl http2;
    server_name bshpbrothers.com www.bshpbrothers.com;

    # ssl_certificate     /ruta/fullchain.pem;
    # ssl_certificate_key /ruta/privkey.pem;

    root /var/www/bshp;          # <-- aquí va el contenido de web/
    index index.html;

    # /thegame/ y /legal/ son carpetas reales con su index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # compresión: texto sí, imágenes y vídeo no (ya vienen comprimidos)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vídeos: un año. Cuando cambian, cambian de nombre.
    location ~* \.(mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML, CSS, JS e imágenes: sin caché mientras el sitio esté en revisión.
    # Con ETag la respuesta es un 304 y no cuesta ancho de banda.
    location ~* \.(html|css|js|jpg|jpeg|png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}

# http → https (el checkout de Hotmart no abre en http)
server {
    listen 80;
    server_name bshpbrothers.com www.bshpbrothers.com;
    return 301 https://$host$request_uri;
}
