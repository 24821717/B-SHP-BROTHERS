# Netlify — B-SHP BROTHERS
# Sitio estático: no hay build. Se publica la carpeta web/ tal cual.
#   /          → web/index.html          (placeholder de la home)
#   /thegame   → web/thegame/index.html  (la sales page)

[build]
  publish = "web"

# Cache larga para los assets (imágenes, video, css, js)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# El HTML siempre fresco, para que Fer vea los cambios al recargar
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
