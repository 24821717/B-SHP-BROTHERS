# Netlify — B-SHP BROTHERS
# Sitio estático: no hay build. Se publica la carpeta web/ tal cual.
#   /          → web/index.html          (la HOME institucional)
#   /thegame   → web/thegame/index.html  (la sales page)

[build]
  publish = "web"
  # BLACKBRO habla con Dify desde aqui: la API Key vive en la funcion,
  # nunca en el navegador ni en el repo.
  functions = "netlify/functions"

# NO PONER AQUI UN REDIRECT A /api/blackbro/*.
#
# blackbro-chat.mjs es una funcion v2 y se rutea ella sola:
#     export const config = { path: '/api/blackbro/chat' }
# O sea que NO existe en /.netlify/functions/blackbro-chat.
#
# Aqui hubo un redirect forzado de /api/blackbro/* a esa ruta vieja. Al ser
# `force`, ganaba sobre la ruta de la propia funcion y mandaba la peticion
# justo donde no hay nada: 404 en produccion con la funcion bien desplegada.
# En local no se notaba, porque scripts/dev.mjs rutea /api/blackbro el mismo
# y no lee este archivo.
#
# La cabecera `no-store` tampoco hace falta: la pone la funcion en cada
# respuesta (JSON_HEAD y el SSE del streaming).

# Los vídeos sí van con caché larga: pesan mucho y, cuando cambian, cambian de
# nombre.
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes, CSS y JS NO. Aquí se cachearon un año con el nombre de siempre y el
# cliente siguió viendo el logo viejo —con su caja negra— después de arreglarlo.
# Mientras la web esté en revisión, que el navegador pregunte siempre: con ETag
# la respuesta es un 304 y no cuesta nada.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El HTML siempre fresco, para que Fer vea los cambios al recargar
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
